name: Test debug mode flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a dummy APK file to satisfy the file input requirement
      - name: Create dummy artifact
        run: |
          echo "dummy apk content" > /tmp/test-debug-app.apk

      - id: upload_debug
        name: Run Firebase Distribution action with debug enabled
        uses: .
        continue-on-error: true
        with:
          appId: "1:123456789:android:abcdef1234567890"
          token: "fake-token-for-testing"
          file: /tmp/test-debug-app.apk
          debug: true
          releaseNotes: "Debug mode test"

      - name: Assert action ran in debug mode
        env:
          OUTCOME: ${{ steps.upload_debug.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should have been invoked (not skipped), even if it fails
          # due to invalid credentials. Debug mode should not prevent it from running.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with debug=true (outcome=$OUTCOME)"
