name: Test debug flag input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy APK file
        run: |
          echo "dummy apk content" > /tmp/test-app.apk

      - name: Run Firebase Distribution action with debug enabled (expect failure)
        id: action
        uses: .
        with:
          appId: "1:123456789:android:abcdef1234567890"
          token: "fake-token-for-testing"
          file: /tmp/test-app.apk
          debug: true
          releaseNotes: "Test release with debug enabled"
        continue-on-error: true

      - name: Assert action failed (no real credentials, debug mode)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without real Firebase credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed without real credentials (debug flag accepted)"
