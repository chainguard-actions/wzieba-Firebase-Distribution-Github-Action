name: Test debug flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal dummy APK file so the action can find the artifact
      - name: Create dummy APK file
        run: |
          echo "PK dummy apk content" > /tmp/dummy.apk

      - id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:123456789:android:abcdef1234567890"
          token: "fake-invalid-token-for-testing"
          file: "/tmp/dummy.apk"
          releaseNotes: "Test release with debug"
          debug: true

      - name: Assert action failed (debug flag accepted, Firebase auth failed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid.
          # The debug flag should be accepted without causing a setup error.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token (debug mode), but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with debug flag enabled and invalid token"
