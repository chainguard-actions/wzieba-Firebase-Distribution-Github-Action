name: Test service credentials file content input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a dummy APK file to satisfy the file input requirement
      - name: Create dummy artifact
        run: |
          echo "dummy apk content" > /tmp/test-service-creds-app.apk

      - id: upload_service_creds
        name: Run Firebase Distribution action with service credentials content
        uses: .
        continue-on-error: true
        with:
          appId: "1:123456789:android:abcdef1234567890"
          serviceCredentialsFileContent: |
            {
              "type": "service_account",
              "project_id": "fake-project",
              "private_key_id": "fake-key-id",
              "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAqCCMhLMBMwFBMkFMkFM\n-----END RSA PRIVATE KEY-----\n",
              "client_email": "fake@fake-project.iam.gserviceaccount.com",
              "client_id": "123456789",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token"
            }
          file: /tmp/test-service-creds-app.apk
          groups: "testers"
          releaseNotes: "Service credentials test"

      - name: Assert action ran with service credentials content
        env:
          OUTCOME: ${{ steps.upload_service_creds.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should have been invoked (not skipped), even if it fails
          # due to invalid service credentials. The key test is that the action
          # accepts the serviceCredentialsFileContent input and runs.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with serviceCredentialsFileContent (outcome=$OUTCOME)"
