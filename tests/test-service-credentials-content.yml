name: Test service credentials file content input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy APK file
        run: |
          echo "dummy apk content" > /tmp/app-release.apk

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:000000000000:android:0000000000000000"
          serviceCredentialsFileContent: |
            {
              "type": "service_account",
              "project_id": "fake-project",
              "private_key_id": "fake-key-id",
              "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAFOKDqMFqFBMCFMFGFMF\n-----END RSA PRIVATE KEY-----\n",
              "client_email": "fake@fake-project.iam.gserviceaccount.com",
              "client_id": "000000000000000000000",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token"
            }
          file: "/tmp/app-release.apk"
          groups: "testers"
          releaseNotes: "Test release with service credentials"

      - name: Assert action failed due to invalid service credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the service credentials are fake,
          # not because of an unexpected crash or missing inputs.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid service credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with fake service credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
