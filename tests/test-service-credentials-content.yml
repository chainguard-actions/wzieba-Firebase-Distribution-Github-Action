name: Test with service credentials file content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy artifact
        run: |
          echo "dummy apk content" > /tmp/app-debug.apk
      - id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:123456789:android:abcdef1234567890"
          serviceCredentialsFileContent: '{"type":"service_account","project_id":"fake-project","private_key_id":"key123","private_key":"-----BEGIN RSA PRIVATE KEY-----\nfake\n-----END RSA PRIVATE KEY-----\n","client_email":"firebase@fake-project.iam.gserviceaccount.com","client_id":"123456789","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          file: "/tmp/app-debug.apk"
          groups: "beta-testers"
          testers: "beta@example.com"
          releaseNotes: "Beta release for testing"
          debug: true
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was reached and executed"
