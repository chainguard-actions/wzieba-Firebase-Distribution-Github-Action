name: Test service credentials file content input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal dummy APK file so the action can find the artifact
      - name: Create dummy APK file
        run: |
          echo "PK dummy apk content" > /tmp/dummy.apk

      # Provide a structurally valid but fake service account JSON
      # The action writes this to service_credentials_content.json and sets
      # GOOGLE_APPLICATION_CREDENTIALS — verifying that code path runs.
      - id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:123456789:android:abcdef1234567890"
          serviceCredentialsFileContent: |
            {
              "type": "service_account",
              "project_id": "fake-project",
              "private_key_id": "key123",
              "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHABQbFBMCBBKMHBBBBBBB\n-----END RSA PRIVATE KEY-----\n",
              "client_email": "fake@fake-project.iam.gserviceaccount.com",
              "client_id": "123456789",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token"
            }
          file: "/tmp/dummy.apk"
          releaseNotes: "Test release with service credentials"

      - name: Assert action failed with Firebase/auth error (not a setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the service credentials are fake,
          # not because of a missing file or misconfiguration.
          # We expect 'failure' since Firebase CLI will reject the fake credentials.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid service credentials"
