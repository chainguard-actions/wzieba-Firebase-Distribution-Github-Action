name: Test Firebase Distribution - Service Credentials File Content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy APK file for testing
        run: |
          echo "dummy apk content" > /tmp/test-app.apk

      - id: action
        name: Run Firebase Distribution action with service credentials content
        uses: .
        continue-on-error: true
        with:
          appId: "1:000000000000:android:0000000000000000"
          serviceCredentialsFileContent: '{"type":"service_account","project_id":"test-project","private_key_id":"key123","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAqKFpNMBiMaKMgPBqkQe\n-----END RSA PRIVATE KEY-----\n","client_email":"test@test-project.iam.gserviceaccount.com","client_id":"000000000000000000000","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          file: "/tmp/test-app.apk"
          releaseNotes: "Test release with service credentials"
          debug: true

      - name: Assert action failed due to invalid service credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid service credentials, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid service credentials content"
