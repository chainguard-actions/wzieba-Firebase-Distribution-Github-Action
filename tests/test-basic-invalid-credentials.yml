name: Test basic usage with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a dummy APK file to satisfy the file input requirement
      - name: Create dummy artifact
        run: |
          echo "dummy apk content" > /tmp/test-app.apk

      - id: upload
        name: Run Firebase Distribution action with invalid credentials
        uses: .
        continue-on-error: true
        with:
          appId: "1:123456789:android:abcdef1234567890"
          token: "fake-token-for-testing"
          file: /tmp/test-app.apk
          releaseNotes: "Test release notes"

      - name: Assert action ran and failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.upload.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token/appId are invalid
          # but it should have been invoked (not skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded with fake credentials"
            echo "PASS: action ran (succeeded)"
          else
            echo "PASS: action ran and failed as expected with invalid credentials (outcome=$OUTCOME)"
          fi
