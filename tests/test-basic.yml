name: Test basic usage with token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy artifact
        run: |
          echo "dummy apk content" > /tmp/app-debug.apk
      - id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:123456789:android:abcdef1234567890"
          token: "fake-upload-token"
          file: "/tmp/app-debug.apk"
          groups: "testers,qa-team"
          testers: "tester@example.com"
          releaseNotes: "Test release notes for CI"
          debug: true
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was reached and executed"
