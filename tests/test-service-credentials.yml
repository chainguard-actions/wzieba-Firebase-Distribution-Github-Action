name: Test with service credentials file content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake artifact and credentials files
        run: |
          echo "fake apk content" > /tmp/app-release.apk
          echo '{"type":"service_account","project_id":"fake-project"}' > /tmp/service-credentials.json
          echo "Release notes from file" > /tmp/release-notes.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:123456789:android:abcdef1234567890"
          serviceCredentialsFile: "/tmp/service-credentials.json"
          serviceCredentialsFileContent: '{"type":"service_account","project_id":"fake-project"}'
          file: "/tmp/app-release.apk"
          releaseNotesFile: "/tmp/release-notes.txt"
          debug: false
      - name: Assert action ran (expected to fail with fake credentials)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: action was invoked with service credentials inputs"
