name: Test Firebase Distribution with service credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy APK file
        run: |
          echo "dummy apk content" > /tmp/app-release.apk

      - name: Create dummy service credentials file
        run: |
          echo '{"type":"service_account","project_id":"fake-project","private_key_id":"key123"}' > /tmp/service-creds.json

      - name: Create release notes file
        run: |
          echo "Release notes from file" > /tmp/release-notes.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:987654321:android:fedcba654321"
          serviceCredentialsFile: "/tmp/service-creds.json"
          serviceCredentialsFileContent: '{"type":"service_account","project_id":"fake-project","private_key_id":"key123"}'
          file: "/tmp/app-release.apk"
          groups: "beta-testers"
          testers: "qa@example.com,dev@example.com"
          releaseNotes: "Service credentials test release"
          releaseNotesFile: "/tmp/release-notes.txt"
          token: "fake-token-for-coverage"
          debug: "false"

      - name: Assert action was invoked
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: Action was invoked with service credentials inputs"
