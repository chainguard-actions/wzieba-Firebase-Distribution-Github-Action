name: Test service credentials inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy artifact and release notes file
        run: |
          echo "dummy apk content" > /tmp/app-release.apk
          echo "Release notes from file" > /tmp/release-notes.txt
          echo '{"type":"service_account","project_id":"fake-project"}' > /tmp/service-credentials.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:123456789:android:abcdef1234567890"
          serviceCredentialsFile: "/tmp/service-credentials.json"
          serviceCredentialsFileContent: '{"type":"service_account","project_id":"fake-project"}'
          file: "/tmp/app-release.apk"
          releaseNotesFile: "/tmp/release-notes.txt"
          debug: false
      - name: Assert action ran (expected to fail without real credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "PASS: action failed as expected without real Firebase credentials"
          fi
