name: Test upload with service credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create fake APK artifact and release notes file
        run: |
          echo "fake apk content" > /tmp/app-release.apk
          echo "Release notes from file" > /tmp/release-notes.txt
          echo '{"type":"service_account","project_id":"fake-project"}' > /tmp/service-credentials.json
      - id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:123456789:android:abcdef1234567890"
          serviceCredentialsFile: /tmp/service-credentials.json
          serviceCredentialsFileContent: '{"type":"service_account","project_id":"fake-project","private_key_id":"key123","private_key":"-----BEGIN RSA PRIVATE KEY-----\nfake\n-----END RSA PRIVATE KEY-----","client_email":"firebase@fake-project.iam.gserviceaccount.com","client_id":"123456","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          file: /tmp/app-release.apk
          releaseNotesFile: /tmp/release-notes.txt
          debug: false
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was reached and executed"
