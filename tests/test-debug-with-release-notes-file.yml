name: Test debug flag and release notes file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy APK and release notes file
        run: |
          echo "dummy apk content" > /tmp/app-debug.apk
          echo "This is a test release with detailed notes." > /tmp/release-notes.txt

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:000000000000:android:0000000000000000"
          token: "fake-firebase-token-for-testing"
          file: "/tmp/app-debug.apk"
          releaseNotesFile: "/tmp/release-notes.txt"
          testers: "tester@example.com"
          debug: true

      - name: Assert action failed due to invalid credentials (not unexpected crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token/appId are invalid.
          # A 'failure' outcome confirms Firebase CLI ran with the debug flag
          # and release notes file inputs, and rejected the fake credentials.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with debug flag and release notes file"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with fake credentials"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
