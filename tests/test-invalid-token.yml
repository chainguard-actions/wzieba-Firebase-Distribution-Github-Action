name: Test invalid token error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a minimal dummy APK file so the action can find the artifact
      - name: Create dummy APK file
        run: |
          echo "PK dummy apk content" > /tmp/dummy.apk

      - id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:123456789:android:abcdef1234567890"
          token: "fake-invalid-token-for-testing"
          file: "/tmp/dummy.apk"
          releaseNotes: "Test release"

      - name: Assert action failed with Firebase error (not a setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the token is invalid,
          # not because of a missing file or misconfiguration.
          # We expect 'failure' since Firebase CLI will reject the fake token.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given an invalid token"
