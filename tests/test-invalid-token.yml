name: Test invalid token error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy APK file
        run: |
          mkdir -p /tmp/test-artifacts
          echo "dummy apk content" > /tmp/test-artifacts/app.apk

      - name: Run action (expect failure with invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:123456789:android:abcdef1234567890"
          token: "invalid-token-for-testing"
          file: "/tmp/test-artifacts/app.apk"
          releaseNotes: "Test release"

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
