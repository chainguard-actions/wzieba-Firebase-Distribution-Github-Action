name: Test serviceCredentialsFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy artifact and service credentials file
        run: |
          echo "dummy apk content" > /tmp/test-app.apk
          cat > /tmp/fake-service-credentials.json << 'EOF'
          {
            "type": "service_account",
            "project_id": "fake-project",
            "private_key_id": "fake-key-id",
            "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0000\n-----END RSA PRIVATE KEY-----\n",
            "client_email": "fake@fake-project.iam.gserviceaccount.com",
            "client_id": "000000000000000000000",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token"
          }
          EOF

      - name: Run action with serviceCredentialsFile input (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:000000000000:android:0000000000000000"
          serviceCredentialsFile: /tmp/fake-service-credentials.json
          file: /tmp/test-app.apk

      - name: Assert action failed (invalid credentials expected)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "success" ]; then
            echo "FAIL: expected action to fail with invalid credentials"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid credentials"
