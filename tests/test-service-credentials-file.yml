name: Test with service credentials file and release notes file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create dummy artifact and credentials files
        run: |
          echo "dummy apk content" > /tmp/app-release.apk
          echo '{"type":"service_account","project_id":"fake-project"}' > /tmp/service-credentials.json
          echo "Release notes from file" > /tmp/release-notes.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:123456789:android:abcdef1234567890"
          serviceCredentialsFile: "/tmp/service-credentials.json"
          file: "/tmp/app-release.apk"
          releaseNotesFile: "/tmp/release-notes.txt"
          debug: true
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was reached and executed"
