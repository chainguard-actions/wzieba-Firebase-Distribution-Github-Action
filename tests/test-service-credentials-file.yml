name: Test service credentials file path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create dummy APK file and fake service credentials file
        run: |
          echo "dummy apk content" > "$GITHUB_WORKSPACE/app-debug.apk"
          cat > "$GITHUB_WORKSPACE/fake-service-credentials.json" <<'EOF'
          {
            "type": "service_account",
            "project_id": "fake-project",
            "private_key_id": "fake-key-id",
            "private_key": "fake-private-key",
            "client_email": "fake@fake-project.iam.gserviceaccount.com",
            "client_id": "000000000000000000000",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:000000000000:android:0000000000000000"
          serviceCredentialsFile: "${{ github.workspace }}/fake-service-credentials.json"
          file: "${{ github.workspace }}/app-debug.apk"
          releaseNotes: "Test release with service credentials file"

      - name: Assert action failed with fake service credentials file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake service credentials file, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with fake service credentials file"
