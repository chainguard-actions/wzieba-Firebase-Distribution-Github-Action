name: Test upload with missing artifact file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Firebase Distribution action with non-existent file (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:123456789:android:abcdef1234567890"
          token: "invalid-token-for-testing"
          file: "/tmp/nonexistent-app.apk"

      - name: Assert action failed due to missing file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed when artifact file does not exist"
            exit 1
          fi
          echo "PASS: action correctly failed when artifact file is missing"
