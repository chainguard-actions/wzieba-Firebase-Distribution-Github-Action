name: Test Firebase Distribution - Missing Artifact File
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run Firebase Distribution action with missing artifact file
        uses: .
        continue-on-error: true
        with:
          appId: "1:000000000000:android:0000000000000000"
          token: "invalid-token-for-testing"
          file: "/tmp/nonexistent-app.apk"
          debug: true

      - name: Assert action failed due to missing file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with missing file, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with missing artifact file"
