name: Test basic upload with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create dummy APK file
        run: |
          echo "dummy apk content" > /tmp/app-release.apk

      - name: Run Firebase Distribution action (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:123456789:android:abcdef1234567890"
          token: "invalid-token-for-testing"
          file: "/tmp/app-release.apk"
          releaseNotes: "Test release notes"
          groups: "testers"

      - name: Assert action failed (not succeeded with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should not succeed with invalid credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
