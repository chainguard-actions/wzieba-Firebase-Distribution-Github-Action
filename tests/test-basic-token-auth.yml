name: Test basic token auth (expected failure)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a dummy APK file for testing
      - name: Create dummy artifact
        run: |
          echo "dummy apk content" > /tmp/test-app.apk

      # The action will fail because the token/appId are invalid,
      # but we want to verify it reaches the firebase CLI call
      # (i.e., the action setup and entrypoint work correctly).
      # We use continue-on-error to capture the failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          appId: "1:123456789:android:abcdef1234567890"
          token: "invalid-token-for-testing"
          file: "/tmp/test-app.apk"
          releaseNotes: "Test release notes"

      - name: Assert action failed due to Firebase auth error (not setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail (invalid credentials), not succeed
          if [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action unexpectedly succeeded with invalid credentials"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials"
